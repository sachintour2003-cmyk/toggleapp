<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - Data Sharing</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        :root {
            --ink: #0a1e3d;
            --gold: #c9a84c;
            --green: #1f8a55;
            --green-bg: #e4f5ec;
            --red: #c1432f;
            --red-bg: #fbe9e6;
            --paper: #f3f5f8;
            --card: #ffffff;
            --line: #e1e5ec;
            --text: #18233a;
            --text-mute: #5b6b85;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a1e3d 0%, #16305a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .control-card {
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .control-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--gold);
        }

        .header-icon {
            width: 80px;
            height: 80px;
            background: var(--paper);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            color: var(--ink);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 22px;
            color: var(--ink);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--text-mute);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Toggle Switch Styles */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--paper);
            border-radius: 16px;
            border: 1px solid var(--line);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 90px;
            height: 46px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 46px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 38px;
            width: 38px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        input:checked + .slider {
            background-color: var(--green);
        }

        input:checked + .slider:before {
            transform: translateX(44px);
        }

        input:disabled + .slider {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .switch-label {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-mute);
            transition: color 0.3s ease;
            width: 70px;
            text-align: left;
        }

        .switch-label.on { color: var(--green); }
        .switch-label.off { color: var(--red); }

        /* Status Box */
        .status-box {
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .status-box.on {
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .status-box.off {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid var(--red);
        }

        .status-box.loading {
            background: var(--paper);
            color: var(--text-mute);
            border: 1px solid var(--line);
        }

        .warning-text {
            font-size: 11.5px;
            color: var(--text-mute);
            margin-top: 20px;
            line-height: 1.5;
            padding-top: 20px;
            border-top: 1px dashed var(--line);
        }
    </style>
</head>
<body>

    <div class="control-card">
        <!-- Header Icon -->
        <div class="header-icon" id="headerIcon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1>Control YourSelf</h1>
        <p class="subtitle">Hello Toggle</p>

        <!-- Toggle Switch -->
        <div class="switch-container">
            <span class="switch-label off" id="labelStatus">OFF</span>
            <label class="switch">
                <input type="checkbox" id="sharingToggle" disabled>
                <span class="slider"></span>
            </label>
        </div>

        <!-- Status Box -->
        <div class="status-box loading" id="statusBox">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span>Connecting to Firebase...</span>
        </div>

        <p class="warning-text">
            <i class="fa-solid fa-circle-info"></i> 
            Karma.
        </p>
    </div>

    <script>
        // Aapki Website ka Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAQbnBB0FxycWtF6B3gKWfG4ZqijNZU9Vw",
            authDomain: "ar-calculator-38781.firebaseapp.com",
            databaseURL: "https://ar-calculator-38781-default-rtdb.firebaseio.com",
            projectId: "ar-calculator-38781",
            storageBucket: "ar-calculator-38781.firebasestorage.app",
            messagingSenderId: "312708241196",
            appId: "1:312708241196:web:b1d73cd31dd267c6627e89"
        };

        // DOM Elements
        const toggle = document.getElementById('sharingToggle');
        const labelStatus = document.getElementById('labelStatus');
        const statusBox = document.getElementById('statusBox');
        const headerIcon = document.getElementById('headerIcon');

        let database = null;
        let controlRef = null;

        // Initialize Firebase
        function initFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                database = firebase.database();
                controlRef = database.ref('control/data_sharing_on');

                // Firebase se current value sunenge
                controlRef.on('value', (snapshot) => {
                    const isOn = snapshot.val() === true;
                    updateUI(isOn);
                    toggle.disabled = false; // Enable toggle once connected
                }, (error) => {
                    console.error("Firebase Error:", error);
                    statusBox.className = 'status-box off';
                    statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span>Connection Error. Check Database Rules.</span>';
                });

            } catch (err) {
                console.error("Init Error:", err);
                statusBox.className = 'status-box off';
                statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span>Firebase Init Failed</span>';
            }
        }

        // UI Update Logic
        function updateUI(isOn) {
            if (isOn) {
                toggle.checked = true;
                labelStatus.textContent = 'ON';
                labelStatus.className = 'switch-label on';
                statusBox.className = 'status-box on';
                statusBox.innerHTML = '<i class="fa-solid fa-lock-open"></i> <span>Data is Visible to Everyone</span>';
                headerIcon.style.background = 'var(--green-bg)';
                headerIcon.style.color = 'var(--green)';
                headerIcon.innerHTML = '<i class="fa-solid fa-shield-halved"></i>';
            } else {
                toggle.checked = false;
                labelStatus.textContent = 'OFF';
                labelStatus.className = 'switch-label off';
                statusBox.className = 'status-box off';
                statusBox.innerHTML = '<i class="fa-solid fa-lock"></i> <span>God</span>';
                headerIcon.style.background = 'var(--red-bg)';
                headerIcon.style.color = 'var(--red)';
                headerIcon.innerHTML = '<i class="fa-solid fa-lock"></i>';
            }
        }

        // Toggle Event Listener
        toggle.addEventListener('change', function() {
            if (!controlRef) return;
            
            const newValue = this.checked;
            
            // Disable temporarily to prevent spam clicks
            toggle.disabled = true;
            statusBox.className = 'status-box loading';
            statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Updating...</span>';

            // Firebase me nayi value set karein
            controlRef.set(newValue)
                .then(() => {
                    // UI will auto-update via the 'on' listener
                    toggle.disabled = false;
                })
                .catch((error) => {
                    console.error("Write Error:", error);
                    alert("Failed to update status. Check internet or database rules.");
                    toggle.checked = !newValue; // Revert UI
                    toggle.disabled = false;
                });
        });

        // Start
        initFirebase();
    </script>
</body>
</html>
